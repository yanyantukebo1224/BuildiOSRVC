name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

    - name: Change Directory
      run: cd Demos/iOS/RVCNative

    # 1. パッケージ依存関係の解決
    - name: Resolve Swift Package Dependencies
      run: |
        cd Demos/iOS/RVCNative
        xcodebuild -resolvePackageDependencies \
          -workspace RVCNative.xcworkspace \
          -scheme RVCNative

    # 2. Release モードで Archive（本番用バイナリの書き出し）を作成
    - name: Build Archive
      run: |
        cd Demos/iOS/RVCNative
        xcodebuild archive \
          -workspace RVCNative.xcworkspace \
          -scheme RVCNative \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/RVCNative.xcarchive \
          ENABLE_PREVIEWS=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    # 3. 正常な構造の IPA ファイルを作成
    - name: Package IPA
      run: |
        cd Demos/iOS/RVCNative
        mkdir -p Payload
        cp -R build/RVCNative.xcarchive/Products/Applications/RVCNative.app Payload/
        zip -r RVCNative.ipa Payload

    # 4. 成果物（IPA）のアップロード
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RVCNative-IPA
        path: Demos/iOS/RVCNative/RVCNative.ipa
