name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install mlx-swift dependency
        run: |
          cd Demos/iOS/RVCNative
          mkdir -p Vendor
          if [ ! -f "Vendor/mlx-swift/Package.swift" ]; then
            echo "mlx-swift submodule is missing or empty. Cloning from GitHub at tag 0.21.0..."
            rm -rf Vendor/mlx-swift
            git clone --depth 1 --branch 0.21.0 https://github.com/ml-explore/mlx-swift.git Vendor/mlx-swift
            cd Vendor/mlx-swift
            git submodule update --init --recursive
          fi

      - name: Resolve Xcode Dependencies
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild -resolvePackageDependencies -workspace RVCNative.xcworkspace -scheme RVCNative

      # 💡 変更点: build ではなく archive を使い、Release モードで単体動作バイナリを作成
      - name: Archive iOS App (Release)
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild archive \
            -workspace RVCNative.xcworkspace \
            -scheme RVCNative \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/RVCNative.xcarchive \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 💡 変更点: xcarchive のProductsフォルダから完全にパッキングされた.appを取り出してIPA化
      - name: Package IPA
        run: |
          cd Demos/iOS/RVCNative
          mkdir -p build/Payload
          cp -R build/RVCNative.xcarchive/Products/Applications/RVCNative.app build/Payload/
          cd build
          zip -r RVCNative.ipa Payload

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVCNative-IPA
          path: Demos/iOS/RVCNative/build/RVCNative.ipa
